bind r source-file ~/.tmux.conf \; display "Reloaded\!"		  # Reload with ctrl-r
bind C-k clear-history							                        # Clear the pane

set -g default-terminal "xterm-256color"  			            # Enable all colors in tmux
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a							                              # prefix from ctrl-b to ctrl-a
unbind C-b									                                # allow ctrl-b for other things
bind C-a send-prefix							                          # Pass on ctrl-a for other apps start with 1 instead of 0

set -sg escape-time 1							                          # quicker responses

set -g base-index 1 							                          # Numbering of windows start with 1 instead of 0
setw -g pane-base-index 1 						                      # Numbering of Panes start with 1 instead of 0

bind | split-window -h 							                        # Split panes horizontal
bind - split-window -v 							                        # Split panes vertically

bind c new-window \; display-popup -w 30 -h 3 -E 'printf "name: "; IFS= read -r name; [ -n "$name" ] && tmux rename-window "$name"'
bind , display-popup -w 30 -h 3 -E 'printf "name: "; IFS= read -r name; [ -n "$name" ] && tmux rename-window "$name"'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation (Cmd+Ctrl+h/l via Ghostty)
bind -n M-H previous-window
bind -n M-L next-window

bind e kill-pane							                              # Closes the pane
bind w kill-window							                            # Closes the whole window
bind q confirm-before -p "Kill session #S? (y/n)" kill-session

# Notes sidebar: full-height right split, persists across all windows
bind-key n run-shell "~/.dotfiles/packages/tmux/scripts/notes-toggle.sh"
bind-key N display-popup -E -w 60% -h 80% "~/.dotfiles/packages/tmux/scripts/notes-picker.sh"
set-hook -g after-new-window "run-shell -b '~/.dotfiles/packages/tmux/scripts/notes-new-window.sh'"

# Enable extended keys for better key handling
set -g extended-keys on
set -g extended-keys-format csi-u

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'mrjones2014/smart-splits.nvim'

# Resurrect & Continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# AstroDark theme colors
set -g status-style "bg=#1B1D22,fg=#ADB0BB"
set -g status-left ""
set -g status-right "#[fg=#50A4E9,bg=#1B1D22] #S "
set -g status-right-length 100
set -g status-position bottom

# Window format (AstroDark colors)
set -g window-status-format "#[fg=#ADB0BB,bg=#1B1D22] #W "
set -g window-status-current-format "#[fg=#1B1D22,bg=#50A4E9,bold] #W "

# Pane borders
set -g pane-border-style "fg=#1B1D22"
set -g pane-active-border-style "fg=#50A4E9"

unbind-key "o"
bind-key "o" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt ' ' \
    --header '^a all  ^t tmux  ^g configs  ^x zoxide  ^d kill  ^f find  ^s save  ^r restore' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt( )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt( )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt( )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt( )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt( )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt( )+reload(sesh list --icons)' \
    --bind 'ctrl-s:execute-silent(~/.tmux/plugins/tmux-resurrect/scripts/save.sh)+abort' \
    --bind 'ctrl-r:execute-silent(~/.tmux/plugins/tmux-resurrect/scripts/restore.sh)+abort' \
)\""

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
